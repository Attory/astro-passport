name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen
      - run: make check
      - run: git diff --check
      - run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t apt-ci .
      - run: test "$(docker inspect apt-ci --format '{{.Config.User}}')" = '10001:10001'
      - run: |
          docker run -d --name apt-smoke --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m apt-ci
          docker exec -i -e EXPECTED_SHA="$GITHUB_SHA" apt-smoke python < scripts/container_smoke.py
      - if: always()
        run: docker rm -f apt-smoke || true
