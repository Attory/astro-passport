name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  corresponding-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Acquire exact matching public sources
        run: python -m compliance.bundle fetch --lock compliance/source-lock.json --cache "$RUNNER_TEMP/source-cache"
      - name: Audit native and OS source correspondence
        run: |
          python -m compliance.audit --lock compliance/source-lock.json --cache "$RUNNER_TEMP/source-cache" --output "$RUNNER_TEMP/correspondence.json"
          cmp compliance/correspondence.json "$RUNNER_TEMP/correspondence.json"
      - name: Reproduce complete exact-revision source bundle
        run: |
          python -m compliance.release --cache "$RUNNER_TEMP/source-cache" --output "$RUNNER_TEMP/source-a.tar"
          python -m compliance.release --cache "$RUNNER_TEMP/source-cache" --output "$RUNNER_TEMP/source-b.tar"
          cmp "$RUNNER_TEMP/source-a.tar" "$RUNNER_TEMP/source-b.tar"
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.10
      - run: uv sync --frozen
      - name: Acquire and rebuild exact public scientific artifacts
        run: uv run --frozen python -m scripts.scientific_artifacts --cache "$RUNNER_TEMP/science-cache" --output "$RUNNER_TEMP/science-artifacts"
      - run: make check
        env:
          APT_TEST_ARTIFACTS: ${{ runner.temp }}/science-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - run: node conformance/acep1.mjs
      - run: git diff --check
      - run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t apt-ci .
      - run: test "$(docker inspect apt-ci --format '{{.Config.User}}')" = '10001:10001'
      - name: Real local HTTPS scientific corpus
        run: uv run --frozen python -m scripts.https_scientific_smoke --image apt-ci --artifacts "$RUNNER_TEMP/science-artifacts" --revision "$GITHUB_SHA"
      - run: |
          docker run -d --name apt-smoke --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m apt-ci
          docker exec -i -e EXPECTED_SHA="$GITHUB_SHA" apt-smoke python < scripts/container_smoke.py
      - if: always()
        run: docker rm -f apt-smoke || true
