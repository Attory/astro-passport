[project]
name = "astro-passport"
version = "0.1.0"
description = "AGPL deterministic Astro Passport service scaffold"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.53.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]

[tool.uv]
package = false
required-version = "==0.12.10"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
