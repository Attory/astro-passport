[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "astropassport-codec"
version = "1.0.0"
description = "Implementation-neutral deterministic CBOR/COSE AstroPassport transport"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = ["cwt==3.3.0", "cbor2==5.9.0", "cryptography==50.0.2"]

[tool.setuptools]
packages = ["passport_codec", "passport_codec.fixtures"]
package-dir = { passport_codec = "." }
include-package-data = true

[tool.setuptools.package-data]
passport_codec = ["PINS.json", "fixtures/golden-v1.json", "LICENSE", "NOTICE"]
